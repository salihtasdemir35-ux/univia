    case 'plan': planDialog(); break; case 'plan-make': planMake(); break;
    case 'plan-save': if (LAST_PLAN) { S.plans.unshift(LAST_PLAN); lsSet('plans', S.plans.slice(0, 50)); toast('Plan kaydedildi: Gezi Planlarım'); } break;
    case 'plan-open': { const p = S.plans.find(x => x.id === b.dataset.id); if (p) dialog(`${dh(p.loc.name)}<div class="db">${planHTML(p)}</div>`, true); break; }
    case 'plan-del': S.plans = S.plans.filter(x => x.id !== b.dataset.id); lsSet('plans', S.plans); viewPlans(); break;
    case 'forme': forMeDialog(); break; case 'forme-go': forMeGo(); break;
    case 'forme-plan': if (FORME) planDialog({ dur: FORME.dur, prefs: FORME.prefs, ex: FORME.ex, auto: true }); break;
    case 'tell': tell(); break;
    case 'download': downloadRegion(); break;
    case 'refresh': if (CUR) { toast('İnternet kaynaklarından güncel veriler çekiliyor…'); openRegion(CUR.loc, true); setTimeout(() => { const s = $('#scan'); if (s) s.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 120); } break;
    case 'report': reportDialog(b.dataset.ref); break; case 'report-send': sendReport(b.dataset.ref); break;
    case 'add-contrib': contribDialog(); break; case 'ct-send': sendContrib(); break;
    case 'ct-timeline': S.ctTimeline = !S.ctTimeline; if (CUR) paintRegion(CUR); else refreshCt(); break;
    case 'ct-ai': if (FORM.ai) { if (FORM.ai.cat) { const r = document.querySelector(`[name=cc][value="${FORM.ai.cat}"]`); if (r) r.checked = true; } if (!$('#cTitle').value && FORM.ai.sum) $('#cTitle').value = FORM.ai.sum.slice(0, 100); } break;
    case 'ct-nophoto': FORM.photo = null; FORM.taken = null; $('#cPrev').innerHTML = ''; $('#cPhoto').value = ''; break;
    case 'ct-geo': { const g = await locate(); if (g) { FORM.lat = g.lat; FORM.lon = g.lon; $('#cLoc').textContent = `Konumunuz: ${g.lat.toFixed(5)}, ${g.lon.toFixed(5)}`; } break; }
    case 'near': { const g = await locate(); if (g) { if (GMAP) GMAP.setView([g.lat, g.lon], 15); whatsHere(g.lat, g.lon); } break; }
    case 'whats': { const c = GMAP ? GMAP.getCenter() : S.loc ? { lat: S.loc.lat, lng: S.loc.lon } : null; if (c) whatsHere(c.lat, c.lng); break; }
    case 'open-rev': { const rev = $('#whatsOut')._rev; if (!rev) break; const ad = rev.address || {};
      const l = regLoc(fromResult({ id: 'n:' + (rev.osm_type || 'x')[0] + rev.osm_id, name: ad.suburb || ad.neighbourhood || ad.village || ad.town || ad.city || rev.name, lat: +b.dataset.lat, lon: +b.dataset.lon, cc: (ad.country_code || '').toUpperCase(), admin: [ad.state || ad.province, ad.county || ad.city || ad.town].filter(Boolean) })); go('#/place/' + encodeURIComponent(l.id)); break; }
    case 'find-city': { const r = await API.geocode(b.dataset.q, { cc: b.dataset.cc, count: 3 }).catch(() => []); if (r[0]) { const l = regLoc(fromResult(r[0])); go('#/place/' + encodeURIComponent(l.id)); } else toast(t('noMatch')); break; }
    case 'notif-perm': if (typeof Notification !== 'undefined') { await Notification.requestPermission().catch(() => {}); viewSettings(); } break;
    case 'dl-del': delete S.downloads[b.dataset.id]; lsSet('downloads', S.downloads); viewSettings(); break;
    case 'clear-cache': { for (const k of await KV.keys('c:')) await KV.del(k); toast('Önbellek temizlendi. Katkılarınız ve ayarlarınız korunur.'); break; }
    case 'me-save': { const n = $('#nick').value.trim(); if (BANNED_TITLES.test(n)) { toast('Doğrulanmamış unvan içeren ad kullanılamaz.'); break; }
      S.me.nick = n; S.me.anon = $('#meAnon').checked; S.me.mod = $('#meMod').checked; lsSet('me', S.me); toast('Profil kaydedildi.'); viewMe(); break; }
  }
}
function onChange(e){
  const tg = e.target;
  if (tg.matches('select[data-filt]') && CUR) { S.filt[tg.dataset.filt] = tg.value; paintRegion(CUR); return; }
  if (tg.id === 'cmpA' || tg.id === 'cmpB') { S[tg.id] = tg.value; viewCompare(); return; }
  if (tg.id === 'setLang') { S.lang = tg.value; lsSet('lang', S.lang); SIDX = null; renderShell(); viewSettings(); return; }
  if (tg.id === 'setTheme') { S.theme = tg.value; lsSet('theme', S.theme); applyTheme(); return; }
  if (tg.id === 'setContrast') { S.contrast = tg.checked; lsSet('contrast', S.contrast); applyTheme(); return; }
  if (tg.id === 'setBig') { S.bigText = tg.checked; lsSet('big', S.bigText); applyTheme(); return; }
  if (tg.id === 'setMode') { S.mode = tg.value; lsSet('mode', S.mode); }
  if (tg.id === 'autoSel') { lsSet('autoSec', +tg.value); if (CUR && SCAN.end) autoSchedule(CUR); scanPaint(); return; }
  if (tg.id === 'setPublic') { lsSet('usePublic', tg.checked); lsSet('route', ''); }
}
function bind(){
  document.addEventListener('click', onClick); document.addEventListener('change', onChange);
  const q = $('#q');
  q.addEventListener('input', () => { if (q.value.trim()) doSearch(q.value); else showRecentSugg(); });
  q.addEventListener('focus', () => { if (!q.value.trim()) showRecentSugg(); });
  q.addEventListener('keydown', e => { const box = $('#sugg'), rows = box.querySelectorAll('[data-sj]');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); if (!rows.length) return; _sAct = (_sAct + (e.key === 'ArrowDown' ? 1 : -1) + rows.length) % rows.length; rows.forEach((r, i) => r.classList.toggle('act', i === _sAct)); rows[_sAct].scrollIntoView({ block: 'nearest' }); }
    else if (e.key === 'Enter') { e.preventDefault(); const rs = box._rows || []; if (rs.length) chooseSearch(rs[Math.max(0, _sAct)]); }
    else if (e.key === 'Escape') closeSugg(); });
  const pk = debounce(inp => pickSuggest(inp), 250);
  document.addEventListener('input', e => { if (e.target.matches('[data-pk]')) pk(e.target); });
  document.addEventListener('focusin', e => { if (e.target.matches('[data-pk]')) pickSuggest(e.target); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#ovl').hidden) closeDialog(); });
  $('#ovl').addEventListener('click', e => { if (e.target.id === 'ovl') closeDialog(); });
  window.addEventListener('hashchange', route);
  window.addEventListener('online', () => { S.online = true; renderShell(); toast('Bağlantı geri geldi. Güncel bilgiler kontrol ediliyor…'); if (CUR) openRegion(CUR.loc); });
  window.addEventListener('offline', () => { S.online = false; renderShell(); toast(t('offlineMsg')); });
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); } catch(_) {}
  const lf = document.querySelector('script[data-vendor="leaflet-js"]');
  if (lf) lf.addEventListener('load', () => { if (S.route === 'place' && S.tab === 'map' && CUR) drawRegionMap(CUR); if (S.route === 'map') viewMap(); });
}
async function init(){
  S.lang = pickLang(); S.theme = lsGet('theme', 'auto'); S.contrast = lsGet('contrast', false); S.bigText = lsGet('big', false); S.mode = lsGet('mode', 'travel');
  S.locs = lsGet('locs', {}); S.favs = lsGet('favs', []); S.follows = lsGet('follows', {}); S.plans = lsGet('plans', []); S.seen = lsGet('seen', {}); S.inbox = lsGet('inbox', []);
  S.downloads = lsGet('downloads', {}); S.votes = lsGet('votes', {}); S.reports = lsGet('reports', []); S.geo = lsGet('geo', null); S.recent = lsGet('recent', []);
  S.me = Object.assign({ id: 'd' + uid(), nick: '', anon: false, mod: false }, lsGet('me', {})); lsSet('me', S.me);
  await KV.open(); applyTheme(); bind();
  const last = lsGet('lastLoc', ''); if (last) S.loc = getLoc(last);
  if (!location.hash) location.replace(last || S.favs.length ? '#/home' : '#/explore');
  renderShell(); await route(); computeFavNew();
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});
}
window.__UNIVIA = { DBG: () => ({ q: DESCQ.length, run: descRun, io: !!DIO }), S, API, netText, newsAll, summarizeUrl, resolveGNews, articleText, summarizeText, cached, keepFields, moderate, analyzeText, trust, makePlan, fuzzyScore, uscore, groupNews, Store, KV, DEMO };
if (HAS_DOM) init().catch(e => { console.error(e); document.getElementById('view').innerHTML = '<div class="empty"><b>Uygulama başlatılamadı</b>' + esc(errMsg(e)) + '</div>'; });
})();
